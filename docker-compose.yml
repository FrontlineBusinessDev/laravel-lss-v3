services:
  # Web Application (FrankenPHP / Octane)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:${PORT:-8000}"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PORT=${PORT:-8000}
    env_file:
      - .env
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PORT:-8000}/up"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3
    # Balanced sizing for an 8GB host shared with another app: covers
    # FrankenPHP + 2 Octane workers (scripts/deploy.sh) with headroom, while
    # leaving ~6GB free for the other app. Raise if requests start getting
    # OOM-killed (`docker inspect` reason 137) or queue up under CPU
    # throttling; lower toward 768m/1.0 cpus if the other app needs more room.
    mem_limit: 1536m
    mem_reservation: 768m
    memswap_limit: 2048m
    cpus: "1.5"

  # Dedicated Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bash", "scripts/worker.sh"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PORT=${PORT:-8000}
    env_file:
      - .env
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    # queue:work already caps per-job memory at 128M (scripts/worker.sh); this
    # bounds the whole container (PHP process + Laravel bootstrap overhead)
    # with a bit more room than the bare minimum.
    mem_limit: 384m
    mem_reservation: 192m
    memswap_limit: 512m
    cpus: "0.5"

# Note: the ./database bind mount above only matters when DB_CONNECTION=sqlite/pgsql.
# The DB is then a file, not a network service, so without a shared mount each
# container gets its own independent copy baked in at build time and
# `web`/`queue` silently stop seeing each other's writes (this is what broke
# queued mail). Harmless no-op if DB_CONNECTION points at a real network
# database instead.